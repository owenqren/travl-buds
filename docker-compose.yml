# Local dev only: DigitalOcean builds backend/Dockerfile directly against Supabase.
# Usage: cp backend/.env.example backend/.env && docker compose up --build
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: travlbuds
      # Throwaway local credentials, not secrets; the backend below uses the same ones.
      POSTGRES_USER: travlbuds
      POSTGRES_PASSWORD: travlbuds
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travlbuds -d travlbuds"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: backend/.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/travlbuds
      DATABASE_USERNAME: travlbuds
      DATABASE_PASSWORD: travlbuds
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
