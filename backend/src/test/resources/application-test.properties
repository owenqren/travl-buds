# Test-only configuration, active via @ActiveProfiles("test").
# Overrides the placeholders in application.properties that normally come
# from environment variables, so the test suite doesn't need real Supabase
# credentials, a Groq API key, or a production JWT secret.

spring.datasource.url=jdbc:h2:mem:travlbuds-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop

groq.api.key=test-groq-key
jwt.secret=test-jwt-secret-do-not-use-in-production
